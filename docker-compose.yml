# Local development stack: Postgres + the API (which also serves the built UI).
#   cp .env.example .env   # optionally add GEMINI_API_KEY
#   docker compose up --build
# Then open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corrobo
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: corrobo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corrobo -d corrobo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://corrobo:changeme@db:5432/corrobo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
