name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corrobo
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: corrobo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corrobo -d corrobo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://corrobo:changeme@localhost:5432/corrobo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
