# Build the image, push it to ECR, and roll it out on the EC2 host.
#
# Prerequisites (one-time, see docs/DEPLOYMENT.md):
#   - `terraform apply` in infra/terraform with github_repository set
#   - Repository *variables* (Settings > Secrets and variables > Actions > Variables):
#       AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URL, EC2_INSTANCE_ID
#   - Optional: DEPLOY_ON_PUSH=true to deploy automatically on every push to main
# No AWS keys are stored in GitHub: the job assumes an IAM role via OIDC.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out on EC2 via SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy corrobo $TAG" \
            --parameters "commands=['/opt/corrobo/deploy.sh $TAG']" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll for up to 15 minutes (pulling a multi-GB image can be slow;
          # `aws ssm wait` gives up after ~100s).
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json
          test "$STATUS" = "Success"
